<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Review your selected Knockout Zone gear before checkout.">
  <meta name="theme-color" content="#05070d">
  <title>Knockout Zone - Cart</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="navbar">
    <div class="logo">KNOCKOUT ZONE</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="community.html">Community</a></li>
      <li><a href="rankings.html">Rankings</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="cart.html" class="active">Cart</a></li>
    </ul>
    <button class="ufc-badge">UFC</button>
  </header>

  <main class="content-container">
    <h1 class="page-title">Your Cart</h1>
    <p class="section-copy">Adjust quantities, remove items, and keep your gear selection ready to checkout.</p>

    <div class="feature-card">
      <div class="shop-actions">
        <p class="section-copy">Cart items: <strong><span data-cart-count>0</span></strong></p>
        <a class="btn" href="shop.html">Continue Shopping</a>
      </div>
      <div id="cartItems"></div>
      <p class="cart-total">Total: <span id="cartTotal">£0.00</span></p>
    </div>
  </main>

  <div id="fighter"></div>
  <script src="./js/script.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
