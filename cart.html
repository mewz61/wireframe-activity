<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knockout Zone Store - Cart</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="site-header">
    <div class="nav-wrap">
      <div class="logo">KNOCKOUT ZONE</div>
      <nav>
        <ul class="nav-list">
          <li><a class="nav-link" href="index.html">Home</a></li>
          <li><a class="nav-link" href="products.html">Products</a></li>
          <li><a class="nav-link active" href="cart.html">Cart</a></li>
          <li><a class="nav-link" href="about.html">About</a></li>
          <li><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <a class="cart-chip" href="cart.html">Cart: <span data-cart-count>0</span></a>
    </div>
  </header>

  <main class="page">
    <section class="cart-panel">
      <h1 class="section-title">Shopping Cart</h1>
      <p class="section-copy">You can add items, remove items, and increase or decrease quantity. Total updates dynamically.</p>
      <div id="cartItems"></div>
      <p class="cart-total">Total: <span id="cartTotal">£0.00</span></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-wrap">
      <span>© 2026 Knockout Zone Store</span>
      <span>DOM cart logic only</span>
    </div>
  </footer>

  <div id="fighter"></div>
  <script src="js/script.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
